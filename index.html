<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, interactive-widget=resizes-visual">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Bingo - fiend4coffee</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/dom-to-image-more@2.16.0/dist/dom-to-image-more.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <div class="loading-text" id="loadingText">Загрузка</div>
            <div class="loading-progress">
                <div class="loading-progress-bar"></div>
            </div>
        </div>
    </div>

    <div class="parent" id="captureArea" style="opacity: 0; visibility: hidden;">
        <a href="https://t.me/davescottishh" class="banner-link">
            <div class="banner-wrapper top-banner-wrapper">
                <img src="https://raw.githubusercontent.com/Marveee3/BingoGD---fiend4coffee-davescottishh/a9e4a1ea0686b9839d16dcadf1411191eff2f7aa/img/topBanner.png" class="banner top-banner" crossorigin="anonymous">
            </div>
        </a>
        
        <main class="grid-main" id="smartGrid"></main>
        
        <a href="https://t.me/davescottishh" class="banner-link">
            <div class="banner-wrapper bottom-banner-wrapper">
                <img src="https://raw.githubusercontent.com/Marveee3/BingoGD---fiend4coffee-davescottishh/a9e4a1ea0686b9839d16dcadf1411191eff2f7aa/img/bottomBanner.png" alt="Баннер" class="banner bottom-banner" id="bottomBanner" crossorigin="anonymous">
            </div>
        </a>

        <div class="button-row">
            <div class="buttons-top-row">
                <a href="https://pay.cloudtips.ru/p/01477e8a" class="dnt-button-link">
                    <button class="dnt-button">Поддержать монеткой</button>
                </a>
                <button id="musicToggleBtn" class="music-toggle-button" title="Вкл/Выкл музыку">
                    <svg class="music-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path class="music-on-icon" d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                        <path class="music-off-icon" d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z M4.5 4.5L19.5 19.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
            <button id="saveBtn" class="save-button">Сохранить как фото</button>
            <button id="iosSaveBtn" class="save-button" style="background-color: #007AFF; display: none;">Скриншот для iPhone</button>
        </div>
    </div>

    <a href="https://github.com/Marveee3" class="github-link"><p>by marveee</p></a>
    
    <audio id="bgMusic" loop preload="auto">
        <source src="sound/bg.ogg" type="audio/ogg">
    </audio>

    <div id="galleryHintModal" style="display:none;">
        <div class="gallery-hint-content">
            <p>📱 Файл сохранён в «Файлы».<br>Откройте его и нажмите <strong>«Сохранить изображение»</strong>, чтобы добавить в галерею.</p>
            <button class="gallery-hint-close">Понятно</button>
        </div>
    </div>

    <div id="iosScreenshotModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:10000; flex-direction:column; align-items:center; justify-content:center; padding:20px;">
        <p style="color:white; text-align:center; margin-bottom:15px; font-family:Arial, sans-serif;">Зажмите пальцем на картинке и выберите <b>«Сохранить в Фото»</b></p>
        <div id="screenshotContainer" style="width:100%; max-height:80vh; overflow:auto; display:flex; justify-content:center;"></div>
        <button id="closeScreenshotModal" style="margin-top:20px; padding:12px 30px; background:#fff; color:#000; border:none; border-radius:25px; font-weight:bold; cursor:pointer;">Закрыть</button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
